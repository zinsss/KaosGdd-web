name: Frontend validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Whitespace check
        run: git diff --check

      - name: Run all frontend tests
        run: |
          set +e
          node --test frontend/tests/*.test.js > /tmp/frontend-tests.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -n -A 18 -B 2 -E "not ok|AssertionError|ERR_ASSERTION" /tmp/frontend-tests.log || true
          fi
          cat /tmp/frontend-tests.log
          exit "$status"
